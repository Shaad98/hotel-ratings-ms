server:
  port: 8083


spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: user-service
            uri: lb://user-service
            predicates:
            - Path=/users/**
          
          - id: hotel-service
            uri: lb://hotel-service
            predicates:
            - Path=/hotels/**,/staffs/**
          
          - id: rating-service
            uri: lb://rating-service
            predicates:
            - Path=/ratings/**
  

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone : http://localhost:8761/eureka